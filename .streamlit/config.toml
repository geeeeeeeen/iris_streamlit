# アプリ共通の見た目設定。
# ローカル実行にもデプロイ先にも同じ設定が適用されます。
# 秘密情報は .streamlit/secrets.toml に置き、コミットしないこと（.gitignore 済み）。

[theme]
base = "light"
primaryColor = "#1f4f8f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8fc"
textColor = "#12203a"

[client]
# スマートフォンで見たときに右上のメニューを控えめにする
toolbarMode = "minimal"
